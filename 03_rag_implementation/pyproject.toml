[project]
name = "06-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "duckdb>=1.4.3",
    "einops>=0.8.1",
    "faiss-cpu",
    "fastapi[standard]>=0.128.0",
    "ipykernel>=7.1.0",
    "itables>=2.6.2",
    "jax>=0.5.3",
    "jinja2>=3.1.6",
    "numpy<2",
    "numpyro>=0.19.0",
    "omegaconf>=2.3.0",
    "openai>=2.41.0",
    "pandas>=2.3.3",
    "prettytable>=3.17.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.12.5",
    "retriv>=0.2.3",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
    "sentence-transformers>=5.2.0",
    "transformers==4.57.5",
    "ujson>=5.11.0",
    "ollama>=0.6.1",
    "asyncio>=4.0.0",
    "ipympl>=0.10.0",
    "rouge-score>=0.1.2",
    "mpltern>=1.0.5",
    "nltk>=3.9.4",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
